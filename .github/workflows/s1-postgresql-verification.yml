name: S1 PostgreSQL Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  POSTGRES_VERSION: "16"
  PGPASSWORD: "jobindex"

jobs:
  s1-verification:
    name: S1 PostgreSQL Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobindex
          POSTGRES_PASSWORD: jobindex
          POSTGRES_DB: jobindex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jobindex -d jobindex"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
        command: >
          postgres
          -c max_connections=100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U jobindex -d jobindex; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run alembic upgrade head
        env:
          JOBINDEX_DATABASE_URL: postgresql+asyncpg://jobindex:jobindex@localhost:5432/jobindex
          JOBINDEX_USER_AGENT: JobIndexBot/0.1 (+https://example.invalid/jobindex; contact=ops@example.invalid)
        run: |
          alembic upgrade head

      - name: Verify required extensions
        run: |
          psql -h localhost -p 5432 -U jobindex -d jobindex -c "
            SELECT extname FROM pg_extension WHERE extname IN ('pg_trgm', 'unaccent', 'pgcrypto');
          "
          # Verify all three required extensions exist
          psql -h localhost -p 5432 -U jobindex -d jobindex -c "
            SELECT CASE WHEN count(*) = 3 THEN 'ALL EXTENSIONS PRESENT' ELSE 'MISSING EXTENSIONS' END
            FROM pg_extension WHERE extname IN ('pg_trgm', 'unaccent', 'pgcrypto');
          "

      - name: Run alembic upgrade head
        env:
          JOBINDEX_DATABASE_URL: postgresql+asyncpg://jobindex:jobindex@localhost:5432/jobindex
          JOBINDEX_USER_AGENT: JobIndexBot/0.1 (+https://example.invalid/jobindex; contact=ops@example.invalid)
        run: |
          alembic upgrade head

      - name: Inspect database objects
        env:
          JOBINDEX_DATABASE_URL: postgresql+asyncpg://jobindex:jobindex@localhost:5432/jobindex
        run: |
          psql -h localhost -p 5432 -U jobindex -d jobindex -c "
            -- List all tables
            SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name;
            
            -- List all enums
            SELECT t.typname FROM pg_type t JOIN pg_namespace n ON t.typnamespace = n.oid WHERE n.nspname = 'public' AND t.typtype = 'e' ORDER BY t.typname;
            
            -- List all indexes with partial status
            SELECT 
              indexname, 
              tablename,
              CASE WHEN indexdef LIKE '%WHERE%' THEN 'PARTIAL' ELSE 'FULL' END as index_type
            FROM pg_indexes 
            WHERE schemaname = 'public' 
            ORDER BY tablename, indexname;
            
            -- Count partial vs full indexes
            SELECT 
              COUNT(*) FILTER (WHERE indexdef LIKE '%WHERE%') as partial_indexes,
              COUNT(*) FILTER (WHERE indexdef NOT LIKE '%WHERE%') as full_indexes
            FROM pg_indexes 
            WHERE schemaname = 'public';
            
            -- List all triggers
            SELECT trigger_name, event_object_table, action_timing, event_manipulation 
            FROM information_schema.triggers 
            WHERE trigger_schema = 'public' 
            ORDER BY event_object_table, trigger_name;
            
            -- List all views
            SELECT table_name FROM information_schema.views WHERE table_schema = 'public';
            
            -- List all functions
            SELECT routine_name FROM information_schema.routines 
            WHERE routine_schema = 'public' AND routine_type = 'FUNCTION' 
            ORDER BY routine_name;
          "

      - name: Verify index inventory matches migration
        run: |
          # Expected from migration 0001_baseline.py:
          # Partial indexes (9): source_due, job_one_canonical_per_cluster, job_open_liveness,
          #   job_sort, job_remote_type, job_salary_floor, occurrence_job_live,
          #   fetch_run_failures, fetch_run_complete_listing
          # Full indexes (9): job_search_tsv_gin, job_company_trgm, job_location_trgm,
          #   job_status_sort, occurrence_source_stale, occurrence_next_check,
          #   fetch_run_source_time, change_event_job_time, change_event_run
          # Total: 18 indexes (9 partial + 9 full)
          
          psql -h localhost -p 5432 -U jobindex -d jobindex -c "
            -- Verify partial indexes
            SELECT indexname FROM pg_indexes 
            WHERE schemaname = 'public' AND indexdef LIKE '%WHERE%' 
            ORDER BY indexname;
          "
          
          psql -h localhost -p 5432 -U jobindex -d jobindex -c "
            -- Verify full indexes
            SELECT indexname FROM pg_indexes 
            WHERE schemaname = 'public' AND indexdef NOT LIKE '%WHERE%' 
            ORDER BY indexname;
          "
          
          # Assert exact counts
          psql -h localhost -p 5432 -U jobindex -d jobindex -c "
            SELECT 
              COUNT(*) FILTER (WHERE indexdef LIKE '%WHERE%') as partial_indexes,
              COUNT(*) FILTER (WHERE indexdef NOT LIKE '%WHERE%') as full_indexes,
              COUNT(*) as total_indexes
            FROM pg_indexes 
            WHERE schemaname = 'public';
          "

      - name: Run database integration tests
        env:
          JOBINDEX_DATABASE_URL: postgresql+asyncpg://jobindex:jobindex@localhost:5432/jobindex
          JOBINDEX_USER_AGENT: JobIndexBot/0.1 (+https://example.invalid/jobindex; contact=ops@example.invalid)
        run: |
          python -m pytest tests/db/test_platform_seed.py -v --tb=short

      - name: Run behavioral invariant tests
        env:
          JOBINDEX_DATABASE_URL: postgresql+asyncpg://jobindex:jobindex@localhost:5432/jobindex
          JOBINDEX_USER_AGENT: JobIndexBot/0.1 (+https://example.invalid/jobindex; contact=ops@example.invalid)
        run: |
          python -m pytest tests/db/test_invariants.py -v --tb=short

      - name: Verify database test counts
        run: |
          echo "Collecting test count..."
          COLLECT_OUTPUT=$(python -m pytest tests/db/test_platform_seed.py tests/db/test_invariants.py --collect-only -q 2>&1)
          echo "$COLLECT_OUTPUT"
          echo "$COLLECT_OUTPUT" | grep -q "51 tests collected" || (echo "FAIL: Expected 51 database tests, got: $(echo "$COLLECT_OUTPUT" | tail -1)" && exit 1)
          echo "Database test count verified: 51 tests collected"

      - name: Test migration downgrade
        env:
          JOBINDEX_DATABASE_URL: postgresql+asyncpg://jobindex:jobindex@localhost:5432/jobindex
        run: |
          alembic downgrade base

      - name: Verify clean downgrade
        run: |
          psql -h localhost -p 5432 -U jobindex -d jobindex -c "
            -- Should have no project tables, views, functions, or enums
            SELECT COUNT(*) as table_count FROM information_schema.tables WHERE table_schema = 'public';
            SELECT COUNT(*) as view_count FROM information_schema.views WHERE table_schema = 'public';
            SELECT COUNT(*) as enum_count FROM pg_type t JOIN pg_namespace n ON t.typnamespace = n.oid WHERE n.nspname = 'public' AND t.typtype = 'e';
            SELECT COUNT(*) as function_count FROM information_schema.routines WHERE routine_schema = 'public' AND routine_type = 'FUNCTION';
          "

      - name: Run alembic upgrade head again
        env:
          JOBINDEX_DATABASE_URL: postgresql+asyncpg://jobindex:jobindex@localhost:5432/jobindex
          JOBINDEX_USER_AGENT: JobIndexBot/0.1 (+https://example.invalid/jobindex; contact=ops@example.invalid)
        run: |
          alembic upgrade head

      - name: Verify re-upgrade
        env:
          JOBINDEX_DATABASE_URL: postgresql+asyncpg://jobindex:jobindex@localhost:5432/jobindex
        run: |
          psql -h localhost -p 5432 -U jobindex -d jobindex -c "
            SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name;
            SELECT COUNT(*) FROM platform;
          "

      - name: Test API readiness with DB available
        env:
          JOBINDEX_DATABASE_URL: postgresql+asyncpg://jobindex:jobindex@localhost:5432/jobindex
          JOBINDEX_USER_AGENT: JobIndexBot/0.1 (+https://example.invalid/jobindex; contact=ops@example.invalid)
        run: |
          # Start API in background
          uvicorn jobindex.api.app:app --host 0.0.0.0 --port 8000 &
          API_PID=$!
          
          # Wait for API readiness with polling (max 30s)
          for i in {1..30}; do
            if curl -f -s http://localhost:8000/healthz | jq -e '.status == "ok"' >/dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            sleep 1
          done
          
          # Test /healthz
          curl -f -s http://localhost:8000/healthz | jq -e '.status == "ok"'
          
          # Test /readyz (should be 200 with DB available)
          curl -f -s http://localhost:8000/readyz | jq -e '.status == "ready"'
          
          kill $API_PID

      - name: Test API readiness with DB unavailable
        env:
          JOBINDEX_DATABASE_URL: postgresql+asyncpg://jobindex:jobindex@localhost:5432/jobindex
        run: |
          # Start API with invalid DB URL to simulate DB unavailable
          JOBINDEX_DATABASE_URL=postgresql+asyncpg://jobindex:jobindex@localhost:5433/jobindex \
          uvicorn jobindex.api.app:app --host 0.0.0.0 --port 8001 &
          API_PID=$!
          
          # Wait for API to start
          sleep 2
          
          # Test /readyz (should be 503)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/readyz)
          if [ "$STATUS" != "503" ]; then
            echo "FAIL: Expected 503, got $STATUS"
            kill $API_PID
            exit 1
          fi
          
          kill $API_PID

      - name: Run all offline tests
        run: |
          python -m pytest tests/ -v -m "not db"

      - name: Run linting and type checking
        run: |
          python -m ruff check src tests
          python -m mypy src

      - name: Phase 0 verification
        run: |
          python scripts/verify_phase0.py