version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobindex
      POSTGRES_PASSWORD: jobindex
      POSTGRES_DB: jobindex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobindex -d jobindex"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      postgres
      -c shared_preload_libraries=pg_trgm,unaccent,pgcrypto
      -c max_connections=100

volumes:
  pgdata: